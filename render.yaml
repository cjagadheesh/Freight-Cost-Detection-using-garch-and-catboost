services:
  # FastAPI backend. The model bundle is trained during the build from the
  # committed market-data snapshot, so the service starts in seconds.
  - type: web
    name: oceanpulse-backend
    runtime: python
    rootDir: backend
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python -m app.ml.train"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: OP_ENVIRONMENT
        value: production
      - key: OP_CORS_ORIGINS
        value: "https://oceanpulse-frontend.onrender.com"
      # Set to true to download fresh Yahoo data at startup (retrains if the data moved).
      - key: OP_REFRESH_ON_STARTUP
        value: "false"
      # Refresh data and retrain in the background every 12 hours (the API keeps
      # serving the previous snapshot meanwhile).
      - key: OP_REFRESH_INTERVAL_HOURS
        value: "12"
      # Bearer token for POST /api/v1/admin/refresh; leave unset to disable the endpoint.
      - key: OP_ADMIN_TOKEN
        sync: false

  # React + Vite static frontend.
  - type: web
    name: oceanpulse-frontend
    runtime: static
    buildCommand: "npm ci && npm run build"
    staticPublishPath: ./dist
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://oceanpulse-backend.onrender.com
